name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Tests, lint, formatting and commit conventions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        env:
          JWT_SECRET_KEY: ci-only-not-a-real-secret-0123456789
        run: python -m pytest -q

      - name: Check formatting
        run: python -m black --check backend/app src tests

      - name: Run flake8
        run: python -m flake8 backend/app src tests

      - name: Validate Conventional Commit titles
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .{1,72}$'
          while IFS= read -r subject; do
            [[ -z "$subject" ]] && continue
            if ! [[ "$subject" =~ $pattern ]]; then
              printf 'Invalid commit title: %s\n' "$subject" >&2
              exit 1
            fi
          done < <(git log --format=%s "${BASE_SHA}..${HEAD_SHA}")
